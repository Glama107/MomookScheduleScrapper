[project]
name = "momook-ics"
version = "0.1.0"
description = "Expose a Momook training schedule as a subscribable iCalendar (.ics) feed"
# 3.9 is the floor so the CLI runs on a stock macOS python3; the Docker image
# used for deployment pins 3.12.
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pyotp>=2.9",
    "icalendar>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dateutil>=2.9",
]

[project.scripts]
momook-ics = "momook_ics.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["momook_ics"]
